[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titans-memory"
version = "0.1.0"
description = "Surprise-weighted persistent memory for AI agents. Based on Google NeurIPS 2025 research."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "sahiixx", email = "sahiixx@example.com"},
]
keywords = [
    "ai", "agent", "memory", "llm", "claude", "titans", "persistent-memory",
    "surprise-weighting", "long-term-memory", "mcp", "claude-code"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]
llm = ["openai>=1.0", "anthropic>=0.30"]

[project.urls]
Homepage = "https://github.com/sahiixx/titans-memory"
Documentation = "https://github.com/sahiixx/titans-memory#readme"
Repository = "https://github.com/sahiixx/titans-memory.git"
Issues = "https://github.com/sahiixx/titans-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/titans_memory"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
